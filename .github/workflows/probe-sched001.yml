name: probe-sched001
on:
  push:
    branches: [probe-sched001]
  workflow_dispatch:
jobs:
  probe:
    name: Java ${{ matrix.java }}, ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 17
            profile: 'firefox,theme-lara,myfaces-4.0'
          - java: 17
            profile: 'firefox,csp,theme-lara,myfaces-4.0'
          - java: 21
            profile: 'firefox,theme-lara,myfaces-4.1'
          - java: 21
            profile: 'firefox,csp,theme-lara,myfaces-4.1'
          - java: 21
            profile: 'chrome,theme-lara,myfaces-4.1'
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-firefox@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build
        run: mvn clean install -T1C -DskipTests -Dcheckstyle.skip -Djsdoc.skip.typedoc=true -Dmaven.javadoc.skip=true --batch-mode -q
      - name: Probe
        run: |
          mvn -B clean install -fprimefaces-integration-tests/pom.xml -Pintegration-tests,headless,${{ matrix.profile }} -Dit.test=Schedule001ProbeTest -Dcheckstyle.skip > probe.log 2>&1 || echo "mvn exit $?"
          grep -E "PROBE|Tests run:|<<<" probe.log | head -80
