name: probe-cd3
on:
  push:
    branches: [probe-cd3]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        load: [none, cpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build
        run: mvn clean install -T1C -DskipTests -Dcheckstyle.skip -Djsdoc.skip.typedoc=true -Dmaven.javadoc.skip=true --batch-mode -q
      - name: Load
        if: matrix.load == 'cpu'
        run: |
          sudo apt-get install -y stress-ng >/dev/null 2>&1
          nohup stress-ng --cpu "$(nproc)" --timeout 5400s >/dev/null 2>&1 &
          sleep 2; pgrep -c stress-ng
      - name: Probe
        run: |
          mvn -B clean install -fprimefaces-integration-tests/pom.xml -Pintegration-tests,headless,chrome,theme-aura,csp,mojarra-4.0 -Dit.test=ConfirmDialog003ProbeTest -Dcheckstyle.skip -Dlicense.skip=true > probe.log 2>&1 || echo "mvn exit $?"
          grep -E "PROBE|Tests run:|ERROR\]" probe.log | head -60
